services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    command: ["--load-only", "fa,en", "--disable-web-ui"]
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - libretranslate-data:/home/libretranslate/.local

volumes:
  libretranslate-data:
